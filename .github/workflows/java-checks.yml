name: Desktop Java checks

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compile
        run: |
          mkdir -p build-check
          javac -cp "lib/sqlite-jdbc-3.46.1.3.jar" -d build-check $(find src -name '*.java')
