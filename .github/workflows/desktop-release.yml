name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes | Out-Null
          $sources = Get-ChildItem -Recurse src -Filter *.java | ForEach-Object { $_.FullName }
          javac -cp "lib/sqlite-jdbc-3.46.1.3.jar" -d build/classes $sources

      - name: Build distributable JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/sqlite | Out-Null
          Push-Location package/sqlite
          jar xf ../../lib/sqlite-jdbc-3.46.1.3.jar
          Remove-Item -Recurse -Force META-INF -ErrorAction SilentlyContinue
          Pop-Location
          New-Item -ItemType Directory -Force package/input | Out-Null
          jar --create --file package/input/Cutdown.jar --main-class Clothes_system.Clothes_system -C build/classes . -C package/sqlite .

      - name: Build Windows installer
        shell: pwsh
        run: |
          jpackage --type exe --name Cutdown --app-version ${env:GITHUB_REF_NAME.TrimStart('v')} --input package/input --main-jar Cutdown.jar --main-class Clothes_system.Clothes_system --dest package/output --win-dir-chooser --win-menu --win-shortcut --vendor "Cutdown"

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem package/output -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer EXE was not created." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content package/output/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cutdown-Windows-${{ github.ref_name }}
          path: package/output/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            package/output/*.exe
            package/output/SHA256SUMS.txt
