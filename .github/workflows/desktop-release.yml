name: Desktop release
# Build trigger: cloud-login release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build-release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes | Out-Null
          $sources = Get-ChildItem -Recurse src -Filter *.java | ForEach-Object { $_.FullName }
          javac -cp "lib/sqlite-jdbc-3.46.1.3.jar" -d build/classes $sources

      - name: Build distributable JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/sqlite | Out-Null
          Push-Location package/sqlite
          jar xf ../../lib/sqlite-jdbc-3.46.1.3.jar
          Get-ChildItem META-INF -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '\\.(SF|RSA|DSA)$' } |
            Remove-Item -Force
          Pop-Location
          New-Item -ItemType Directory -Force package/input | Out-Null
          jar --create --file package/input/Cutdown.jar --main-class Clothes_system.Clothes_system -C build/classes . -C package/sqlite .

      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME.TrimStart("v") } else { $version = "1.1.0.4" }
          jpackage --type exe --name "BPC Clothes System" --app-version $version --input package/input --main-jar Cutdown.jar --main-class Clothes_system.Clothes_system --java-options "-Dcutdown.version=$version" --dest package/output --win-dir-chooser --win-menu --win-shortcut --win-upgrade-uuid "8c4c2d6f-7a8b-4f6d-9c21-1d2a4b7e8f30" --vendor "BPC"

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem package/output -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer EXE was not created." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content package/output/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPC-Clothes-System-Windows-${{ github.ref_name }}
          path: package/output/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0.4' }}
          name: BPC Clothes System v${{ github.ref_type == 'tag' && github.ref_name || '1.1.0.4' }}
          files: |
            package/output/*.exe
            package/output/SHA256SUMS.txt
